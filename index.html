<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Link Example</title>
    <style>
        iframe {
            width: 100%;
            height: 500px;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body>

    <h2>Loading Web Page Content Below:</h2>
    <!-- Embeds the target URL directly into your page -->
    <iframe src="vibehubfun.site" title="Embedded Webpage"></iframe>

</body>
</html>
