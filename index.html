<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Link Example</title>
    <style>
        iframe {
            /* Sets the size exactly to 150px by 150px */
            width: 700px;
            height: 150px;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body>

    <h2>Loading Web Page Content Below:</h2>
    <!-- Embeds the target URL with the correct https protocol -->
    <iframe src="https://vibehubfun.site" title="Embedded Webpage"></iframe>

</body>
</html>
